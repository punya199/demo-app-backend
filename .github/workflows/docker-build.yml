name: Release and Build Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: acelectic/yaya-developer

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Yarn
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.2.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            demo-app-backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ needs.release.outputs.new_release_version }}

  # Skipped until the GCP one-time setup is done (see README "Deployment"): set vars.GCP_PROJECT_ID to enable.
  deploy-cloud-run:
    name: Deploy to Cloud Run
    needs: [release, build-and-push]
    if: needs.release.outputs.new_release_published == 'true' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation, no JSON key
    env:
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/demo-app-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # sharp and bcrypt are native modules: pin the platform Cloud Run runs.
      - name: Build and push image to Artifact Registry
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          # Plain amd64 manifest (no attestation index) so Cloud Run accepts the @digest reference.
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.release.outputs.new_release_version }}
          cache-from: type=gha
          build-args: APP_VERSION=${{ needs.release.outputs.new_release_version }}

      # Point the Job at the new image first, otherwise it runs the previous image's migrations.
      - name: Run database migrations
        run: |
          gcloud run jobs update "${{ vars.CLOUD_RUN_MIGRATE_JOB }}" --image "$IMAGE@${{ steps.build.outputs.digest }}" --region "$REGION"
          gcloud run jobs execute "${{ vars.CLOUD_RUN_MIGRATE_JOB }}" --region "$REGION" --wait

      # Only the image changes; env vars, secrets and scaling set at setup are kept.
      - name: Deploy Cloud Run service
        run: gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" --image "$IMAGE@${{ steps.build.outputs.digest }}" --region "$REGION"
