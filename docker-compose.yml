name: yaya-app
services:
  api:
    image: docker.io/acelectic/yaya-developer:demo-app-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-yaya}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-yaya}
      POSTGRES_DB: ${DATABASE_NAME:-yaya}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-yaya}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway DB for `yarn test:integration` / `yarn test:e2e`: own port, data in RAM (tmpfs).
  # Start with `yarn test:db:up`; never started by a plain `docker compose up`.
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: yaya_test
      POSTGRES_PASSWORD: yaya_test
      POSTGRES_DB: yaya_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./scripts/init-postgres-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaya_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
